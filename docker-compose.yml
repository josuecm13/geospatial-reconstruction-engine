services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: geodb
      POSTGRES_PASSWORD: geodb
      POSTGRES_DB: geodb
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geodb -d geodb"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgis_data:
